          keytool -genkeypair -v -keystore app/keystore.jks -alias androiddebugkey \
            -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=KeyMap,O=KeyMap,C=CN"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: 编译 APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 上传 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}-${{ github.run_attempt }}
          name: KeyMap build ${{ github.run_number }}
          files: app/build/outputs/apk/release/app-release.apk
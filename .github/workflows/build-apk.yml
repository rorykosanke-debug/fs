name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: SDK 组件
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null || true

      - name: 生成工程文件
        run: |
          set -e
          mkdir -p app/src/main/java/com/rorykosanke/keymap
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  gradlePluginPortal()
                  google()
                  mavenCentral()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'KeyMap'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          org.gradle.parallel=true
          systemProp.org.gradle.internal.http.connectionTimeout=120000
          systemProp.org.gradle.internal.http.socketTimeout=120000
          systemProp.org.gradle.internal.repository.max.tentatives=6
          systemProp.org.gradle.internal.repository.initial.backoff=2000
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.rorykosanke.keymap'
              compileSdk 34

              defaultConfig {
                  applicationId "com.rorykosanke.keymap"
                  minSdk 26
                  targetSdk 34
                  versionCode 2
                  versionName "1.1"
              }

              signingConfigs {
                  release {
                      storeFile file('keystore.jks')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
                  debug {
                      signingConfig signingConfigs.release
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
          }
          EOF

          cat > app/proguard-rules.pro <<'EOF'
          # no rules
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".KeyMapService"
                      android:exported="false"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowsChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagRequestFilterKeyEvents"
              android:canPerformGestures="true"
              android:canRequestFilterKeyEvents="true"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="100"
              android:description="@string/service_desc" />
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">键盘映射</string>
              <string name="service_desc">把外接键盘按键映射为屏幕触摸，用于手游操作。</string>
          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#1E88E5" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#FFFFFF" android:pathData="M18,34h72v40h-72z" />
              <path android:fillColor="#1E88E5" android:pathData="M26,42h8v8h-8z M40,42h8v8h-8z M54,42h8v8h-8z M68,42h14v8h-14z M26,56h56v8h-56z" />
          </vector>
          EOF

          cat > app/src/main/java/com/rorykosanke/keymap/Mapping.kt <<'EOF'
          package com.rorykosanke.keymap

          import android.view.KeyEvent
          import org.json.JSONArray
          import org.json.JSONObject

          class Mapping {
              var type: String = TYPE_TAP
              var keys: MutableList<Int> = ArrayList()
              var x: Float = 0f
              var y: Float = 0f
              var x2: Float = 0f
              var y2: Float = 0f
              var rate: Int = 10

              fun toJson(): JSONObject {
                  val o = JSONObject()
                  o.put("t", type)
                  val arr = JSONArray()
                  for (k in keys) arr.put(k)
                  o.put("k", arr)
                  o.put("x", x.toDouble())
                  o.put("y", y.toDouble())
                  o.put("x2", x2.toDouble())
                  o.put("y2", y2.toDouble())
                  o.put("r", rate)
                  return o
              }

              companion object {
                  const val TYPE_TAP = "tap"
                  const val TYPE_HOLD = "hold"
                  const val TYPE_RAPID = "rapid"
                  const val TYPE_JOY = "joy"
                  const val TYPE_PAN = "pan"

                  fun fromJson(o: JSONObject): Mapping {
                      val m = Mapping()
                      m.type = o.optString("t", TYPE_TAP)
                      val arr = o.optJSONArray("k")
                      if (arr != null) {
                          for (i in 0 until arr.length()) m.keys.add(arr.optInt(i))
                      }
                      m.x = o.optDouble("x", 0.0).toFloat()
                      m.y = o.optDouble("y", 0.0).toFloat()
                      m.x2 = o.optDouble("x2", 0.0).toFloat()
                      m.y2 = o.optDouble("y2", 0.0).toFloat()
                      m.rate = o.optInt("r", 10)
                      return m
                  }

                  fun keyName(code: Int): String {
                      val s = KeyEvent.keyCodeToString(code)
                      return if (s.startsWith("KEYCODE_")) s.substring(8) else s
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/rorykosanke/keymap/Store.kt <<'EOF'
          package com.rorykosanke.keymap

          import android.content.Context
          import org.json.JSONArray

          object Store {
              private const val PREF = "keymap_store"

              private fun sp(c: Context) = c.getSharedPreferences(PREF, Context.MODE_PRIVATE)

              fun load(c: Context, pkg: String): MutableList<Mapping> {
                  val out = ArrayList<Mapping>()
                  val s = sp(c).getString("cfg_" + pkg, null) ?: return out
                  try {
                      val arr = JSONArray(s)
                      for (i in 0 until arr.length()) out.add(Mapping.fromJson(arr.getJSONObject(i)))
                  } catch (e: Exception) {
                      out.clear()
                  }
                  return out
              }

              fun save(c: Context, pkg: String, list: List<Mapping>) {
                  val arr = JSONArray()
                  for (m in list) arr.put(m.toJson())
                  sp(c).edit().putString("cfg_" + pkg, arr.toString()).apply()
              }

              fun packages(c: Context): List<String> {
                  return sp(c).all.keys
                      .filter { it.startsWith("cfg_") }
                      .map { it.substring(4) }
                      .sorted()
              }

              fun delete(c: Context, pkg: String) {
                  sp(c).edit().remove("cfg_" + pkg).apply()
              }

              fun clearAll(c: Context) {
                  sp(c).edit().clear().apply()
              }
          }
          EOF

          cat > app/src/main/java/com/rorykosanke/keymap/GestureEngine.kt <<'EOF'
          package com.rorykosanke.keymap

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.graphics.Path
          import android.os.Handler
          import android.os.Looper

          class GestureEngine(private val svc: AccessibilityService) {

              private val handler = Handler(Looper.getMainLooper())
              private val queue = ArrayDeque<GestureDescription>()
              private var busy = false

              private val watchdog = Runnable {
                  busy = false
                  pump()
              }

              fun tap(x: Float, y: Float, ms: Long = 40) {
                  val p = Path()
                  p.moveTo(x, y)
                  p.lineTo(x + 0.6f, y + 0.6f)
                  add(GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(p, 0L, ms))
                      .build())
              }

              fun swipe(x1: Float, y1: Float, x2: Float, y2: Float, ms: Long = 100) {
                  val d = if (ms < 16L) 16L else ms
                  val p = Path()
                  p.moveTo(x1, y1)
                  if (x1 == x2 && y1 == y2) p.lineTo(x2 + 0.6f, y2 + 0.6f) else p.lineTo(x2, y2)
                  add(GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(p, 0L, d))
                      .build())
              }

              private fun add(g: GestureDescription) {
                  if (queue.size > 8) return
                  queue.addLast(g)
                  pump()
              }

              private fun pump() {
                  if (busy) return
                  val g = queue.removeFirstOrNull() ?: return
                  busy = true
                  val cb = object : AccessibilityService.GestureResultCallback() {
                      override fun onCompleted(gestureDescription: GestureDescription?) {
                          done()
                      }

                      override fun onCancelled(gestureDescription: GestureDescription?) {
                          done()
                      }

                      fun done() {
                          handler.removeCallbacks(watchdog)
                          busy = false
                          pump()
                      }
                  }
                  val ok = svc.dispatchGesture(g, cb, handler)
                  if (!ok) {
                      busy = false
                      return
                  }
                  handler.postDelayed(watchdog, 1200L)
              }
          }
          EOF

          cat > app/src/main/java/com/rorykosanke/keymap/KeyMapService.kt <<'EOF'
          package com.rorykosanke.keymap

          import android.accessibilityservice.AccessibilityService
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.os.Handler
          import android.os.Looper
          import android.util.TypedValue
          import android.view.Gravity
          import android.view.KeyEvent
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import kotlin.math.hypot
          import kotlin.math.roundToInt

          class KeyMapService : AccessibilityService() {

              companion object {
                  @Volatile
                  var alive = false
              }

              private val handler = Handler(Looper.getMainLooper())
              private lateinit var wm: WindowManager
              private lateinit var engine: GestureEngine

              private var bubble: TextView? = null
              private var panel: LinearLayout? = null
              private var panelShown = false
              private var editBtn: TextView? = null
              private var pkgLabel: TextView? = null
              private var promptView: TextView? = null
              private var captureView: View? = null
              private var menuWin: View? = null

              private var currentPkg = ""
              private val maps = ArrayList<Mapping>()
              private val markerWindows = ArrayList<Pair<TextView, WindowManager.LayoutParams>>()
              private var editMode = true
              private val downKeys = HashSet<Int>()
              private val loops = HashMap<String, Runnable>()

              private var awaitingKey = false
              private var needKeys = 0
              private val gotKeys = ArrayList<Int>()
              private var keyCb: ((List<Int>) -> Unit)? = null
              private var draftType = ""

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  alive = true
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  engine = GestureEngine(this)
                  addBubble()
                  handler.postDelayed({
                      try {
                          val p = rootInActiveWindow?.packageName?.toString()
                          if (p != null && p != packageName) switchPkg(p)
                      } catch (e: Exception) {
                      }
                  }, 900L)
              }

              override fun onInterrupt() {}

              override fun onDestroy() {
                  alive = false
                  stopAllLoops()
                  if (!::wm.isInitialized) {
                      super.onDestroy()
                      return
                  }
                  try {
                      closeMarkerMenu()
                      clearMarkers()
                      closePanel()
                      bubble?.let { wm.removeView(it) }
                      promptView?.let { wm.removeView(it) }
                      captureView?.let { wm.removeView(it) }
                  } catch (e: Exception) {
                  }
                  bubble = null
                  promptView = null
                  captureView = null
                  super.onDestroy()
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (event == null) return
                  if (event.eventType != AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) return
                  val p = event.packageName?.toString() ?: return
                  if (p == packageName) return
                  if (p == "com.android.systemui") return
                  if (p.contains("inputmethod", true) || p.contains("keyboard", true)) return
                  switchPkg(p)
              }

              override fun onKeyEvent(event: KeyEvent): Boolean {
                  val code = event.keyCode

                  if (awaitingKey) {
                      if (event.action == KeyEvent.ACTION_DOWN) {
                          if (gotKeys.contains(code)) {
                              toast("这个键上一步已经用过了，请换一个")
                              return true
                          }
                          gotKeys.add(code)
                          if (gotKeys.size >= needKeys) {
                              awaitingKey = false
                              hidePrompt()
                              val cb = keyCb
                              keyCb = null
                              if (cb != null) cb(ArrayList(gotKeys))
                          } else {
                              updateKeyPrompt()
                          }
                      }
                      return true
                  }

                  if (event.action == KeyEvent.ACTION_DOWN) {
                      downKeys.add(code)
                  } else if (event.action == KeyEvent.ACTION_UP) {
                      downKeys.remove(code)
                  }

                  var handled = false
                  for (m in maps) {
                      if (!m.keys.contains(code)) continue
                      handled = true
                      if (event.action == KeyEvent.ACTION_DOWN) {
                          if (event.repeatCount == 0) startAction(m, code)
                      } else if (event.action == KeyEvent.ACTION_UP) {
                          stopAction(m, code)
                      }
                  }
                  return handled
              }

              // ---------- 映射执行 ----------

              private fun startAction(m: Mapping, code: Int) {
                  when (m.type) {
                      Mapping.TYPE_TAP -> engine.tap(m.x, m.y)
                      Mapping.TYPE_HOLD -> startLoop(m, code, 340L) { engine.tap(m.x, m.y, 330) }
                      Mapping.TYPE_RAPID -> startLoop(m, code, (1000 / Math.max(1, m.rate)).toLong()) {
                          engine.tap(m.x, m.y, 28)
                      }
                      Mapping.TYPE_PAN -> startLoop(m, code, 130L) {
                          engine.swipe(m.x, m.y, m.x2, m.y2, 110)
                      }
                      Mapping.TYPE_JOY -> startLoop(m, code, 130L) {
                          val d = joyVec(m)
                          if (d.first != 0f || d.second != 0f) {
                              engine.swipe(m.x, m.y, m.x + d.first, m.y + d.second, 115)
                          }
                      }
                  }
              }

              private fun stopAction(m: Mapping, code: Int) {
                  stopLoop(m, code)
              }

              private fun joyVec(m: Mapping): Pair<Float, Float> {
                  if (m.keys.size < 4) return 0f to 0f
                  var sx = 0f
                  var sy = 0f
                  if (downKeys.contains(m.keys[0])) sy -= 1f
                  if (downKeys.contains(m.keys[1])) sx -= 1f
                  if (downKeys.contains(m.keys[2])) sy += 1f
                  if (downKeys.contains(m.keys[3])) sx += 1f
                  if (sx == 0f && sy == 0f) return 0f to 0f
                  val len = hypot(sx, sy)
                  val r = hypot(m.x2 - m.x, m.y2 - m.y)
                  return (sx / len * r) to (sy / len * r)
              }

              private fun loopTag(m: Mapping, code: Int): String =
                  System.identityHashCode(m).toString() + ":" + code

              private fun startLoop(m: Mapping, code: Int, interval: Long, body: () -> Unit) {
                  val tag = loopTag(m, code)
                  if (loops.containsKey(tag)) return
                  val r = object : Runnable {
                      override fun run() {
                          if (!loops.containsKey(tag)) return
                          body()
                          handler.postDelayed(this, interval)
                      }
                  }
                  loops[tag] = r
                  body()
                  handler.postDelayed(r, interval)
              }

              private fun stopLoop(m: Mapping, code: Int) {
                  val r = loops.remove(loopTag(m, code))
                  if (r != null) handler.removeCallbacks(r)
              }

              private fun stopAllLoops() {
                  for (r in loops.values) handler.removeCallbacks(r)
                  loops.clear()
                  downKeys.clear()
              }

              // ---------- 配置 ----------

              private fun switchPkg(p: String) {
                  if (p == currentPkg) return
                  stopAllLoops()
                  closeMarkerMenu()
                  currentPkg = p
                  maps.clear()
                  maps.addAll(Store.load(this, p))
                  pkgLabel?.text = shortPkg(p)
                  rebuildMarkers()
              }

              private fun addMapping(m: Mapping) {
                  maps.add(m)
                  saveAll()
                  toast("已添加，点「玩」隐藏标记即可使用；长按标记可改键")
              }

              private fun clearCurrent() {
                  maps.clear()
                  saveAll()
                  toast("已清空当前 App 的映射")
              }

              private fun saveAll() {
                  Store.save(this, currentPkg, maps)
                  rebuildMarkers()
              }

              private fun removeMapping(m: Mapping) {
                  maps.remove(m)
                  saveAll()
                  toast("已删除该按键")
              }

              private fun nextRate(r: Int): Int = when (r) {
                  5 -> 10
                  10 -> 15
                  15 -> 20
                  else -> 5
              }

              private fun shortPkg(p: String): String {
                  if (p.isEmpty()) return "未识别"
                  val parts = p.split(".")
                  return if (parts.size >= 2) parts[parts.size - 1] else p
              }

              // ---------- 编辑流程 ----------

              private fun placeSimple(type: String) {
                  draftType = type
                  showPrompt("点一下屏幕，选择「" + typeName(type) + "」的位置")
                  capturePoint { x, y ->
                      val m = Mapping()
                      m.type = type
                      m.x = x
                      m.y = y
                      askKeys(1) { keys ->
                          m.keys.addAll(keys)
                          addMapping(m)
                      }
                  }
              }

              private fun placeJoy() {
                  draftType = Mapping.TYPE_JOY
                  showPrompt("点一下「摇杆中心」位置")
                  capturePoint { cx, cy ->
                      showPrompt("再点一下「摇杆推到最远」的位置（决定半径）")
                      capturePoint { ex, ey ->
                          val m = Mapping()
                          m.type = Mapping.TYPE_JOY
                          m.x = cx
                          m.y = cy
                          m.x2 = ex
                          m.y2 = ey
                          askKeys(4) { keys ->
                              m.keys.addAll(keys)
                              addMapping(m)
                          }
                      }
                  }
              }

              private fun placePan() {
                  draftType = Mapping.TYPE_PAN
                  showPrompt("点一下「视角区起点」")
                  capturePoint { x1, y1 ->
                      showPrompt("再点一下「划动方向终点」")
                      capturePoint { x2, y2 ->
                          val m = Mapping()
                          m.type = Mapping.TYPE_PAN
                          m.x = x1
                          m.y = y1
                          m.x2 = x2
                          m.y2 = y2
                          askKeys(1) { keys ->
                              m.keys.addAll(keys)
                              addMapping(m)
                          }
                      }
                  }
              }

              private fun rebind(m: Mapping) {
                  closeMarkerMenu()
                  draftType = m.type
                  val n = if (m.type == Mapping.TYPE_JOY) 4 else 1
                  askKeys(n) { keys ->
                      m.keys.clear()
                      m.keys.addAll(keys)
                      saveAll()
                      toast("按键已修改")
                  }
              }

              private fun rePlace(m: Mapping) {
                  closeMarkerMenu()
                  draftType = m.type
                  if (m.type == Mapping.TYPE_JOY) {
                      showPrompt("重新点「摇杆中心」")
                      capturePoint { cx, cy ->
                          showPrompt("重新点「摇杆最远点」")
                          capturePoint { ex, ey ->
                              m.x = cx
                              m.y = cy
                              m.x2 = ex
                              m.y2 = ey
                              saveAll()
                              hidePrompt()
                              toast("位置已更新")
                          }
                      }
                  } else if (m.type == Mapping.TYPE_PAN) {
                      showPrompt("重新点「划动起点」")
                      capturePoint { x1, y1 ->
                          showPrompt("重新点「划动终点」")
                          capturePoint { x2, y2 ->
                              m.x = x1
                              m.y = y1
                              m.x2 = x2
                              m.y2 = y2
                              saveAll()
                              hidePrompt()
                              toast("位置已更新")
                          }
                      }
                  }
              }

              private fun capturePoint(cb: (Float, Float) -> Unit) {
                  removeCapture()
                  val v = View(this)
                  v.setBackgroundColor(0x15000000)
                  v.setOnTouchListener { _, e ->
                      if (e.actionMasked == MotionEvent.ACTION_UP) {
                          val x = e.rawX
                          val y = e.rawY
                          removeCapture()
                          cb(x, y)
                      }
                      true
                  }
                  val lp = overlayLp(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      true
                  )
                  try {
                      wm.addView(v, lp)
                      captureView = v
                  } catch (e: Exception) {
                      toast("无法添加选取层：" + e.message)
                  }
              }

              private fun removeCapture() {
                  captureView?.let {
                      try {
                          wm.removeView(it)
                      } catch (e: Exception) {
                      }
                  }
                  captureView = null
              }

              private fun askKeys(n: Int, cb: (List<Int>) -> Unit) {
                  needKeys = n
                  gotKeys.clear()
                  keyCb = cb
                  awaitingKey = true
                  updateKeyPrompt()
              }

              private fun updateKeyPrompt() {
                  val idx = gotKeys.size
                  var dir = ""
                  if (draftType == Mapping.TYPE_JOY) {
                      val names = arrayOf("上", "左", "下", "右")
                      if (idx < names.size) dir = "（" + names[idx] + "方向）"
                  }
                  showPrompt("请按下要绑定的键盘键 " + dir + "  [" + (idx + 1) + "/" + needKeys + "]")
              }

              // ---------- 标记 ----------

              private fun rebuildMarkers() {
                  closeMarkerMenu()
                  clearMarkers()
                  if (!editMode) return
                  for (m in maps) addMarkerView(m)
              }

              private fun clearMarkers() {
                  for (p in markerWindows) {
                      try {
                          wm.removeView(p.first)
                      } catch (e: Exception) {
                      }
                  }
                  markerWindows.clear()
              }

              private fun addMarkerView(m: Mapping) {
                  val tv = TextView(this)
                  tv.text = labelOf(m)
                  tv.textSize = 10f
                  tv.setTextColor(Color.WHITE)
                  tv.gravity = Gravity.CENTER
                  tv.setPadding(dp(7), dp(5), dp(7), dp(5))
                  tv.background = roundBg(colorOf(m), dp(9))
                  val lp = overlayLp(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      true
                  )
                  lp.x = (m.x - dp(16)).roundToInt()
                  lp.y = (m.y - dp(14)).roundToInt()

                  var downRawX = 0f
                  var downRawY = 0f
                  var baseLpX = 0
                  var baseLpY = 0
                  var baseX = 0f
                  var baseY = 0f
                  var baseX2 = 0f
                  var baseY2 = 0f
                  var downAt = 0L
                  var movedEnough = false

                  tv.setOnTouchListener { v, e ->
                      when (e.actionMasked) {
                          MotionEvent.ACTION_DOWN -> {
                              downRawX = e.rawX
                              downRawY = e.rawY
                              baseLpX = lp.x
                              baseLpY = lp.y
                              baseX = m.x
                              baseY = m.y
                              baseX2 = m.x2
                              baseY2 = m.y2
                              downAt = System.currentTimeMillis()
                              movedEnough = false
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = e.rawX - downRawX
                              val dy = e.rawY - downRawY
                              if (Math.abs(dx) > dp(8) || Math.abs(dy) > dp(8)) movedEnough = true
                              lp.x = (baseLpX + dx).roundToInt()
                              lp.y = (baseLpY + dy).roundToInt()
                              wm.updateViewLayout(v, lp)
                              m.x = baseX + dx
                              m.y = baseY + dy
                              if (m.type == Mapping.TYPE_JOY || m.type == Mapping.TYPE_PAN) {
                                  m.x2 = baseX2 + dx
                                  m.y2 = baseY2 + dy
                              }
                              true
                          }
                          MotionEvent.ACTION_UP -> {
                              Store.save(this@KeyMapService, currentPkg, maps)
                              if (!movedEnough && System.currentTimeMillis() - downAt > 400L) {
                                  openMarkerMenu(m)
                              }
                              true
                          }
                          else -> false
                      }
                  }
                  try {
                      wm.addView(tv, lp)
                      markerWindows.add(tv to lp)
                  } catch (e: Exception) {
                      toast("添加标记失败：" + e.message)
                  }
              }

              private fun openMarkerMenu(m: Mapping) {
                  closeMarkerMenu()
                  val box = LinearLayout(this)
                  box.orientation = LinearLayout.VERTICAL
                  box.setPadding(dp(6), dp(8), dp(6), dp(8))
                  box.background = roundBg(0xF02B2B2B.toInt(), dp(12))

                  val t = TextView(this)
                  t.textSize = 9f
                  t.setTextColor(0xFFBBBBBB.toInt())
                  t.text = labelOf(m)
                  box.addView(t)

                  box.addView(pbtn("改键") { rebind(m) })
                  if (m.type == Mapping.TYPE_JOY || m.type == Mapping.TYPE_PAN) {
                      box.addView(pbtn("重设位置") { rePlace(m) })
                  }
                  if (m.type == Mapping.TYPE_RAPID) {
                      box.addView(pbtn("速率 " + m.rate + "/s") {
                          m.rate = nextRate(m.rate)
                          closeMarkerMenu()
                          saveAll()
                          toast("连发速率：" + m.rate + " 次/秒")
                      })
                  }
                  box.addView(pbtn("删除") {
                      removeMapping(m)
                      closeMarkerMenu()
                  })
                  box.addView(pbtn("✕") { closeMarkerMenu() })

                  val lp = overlayLp(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      true
                  )
                  lp.gravity = Gravity.TOP or Gravity.START
                  val dm = resources.displayMetrics
                  lp.x = Math.min(m.x.roundToInt() + dp(18), dm.widthPixels - dp(112))
                  lp.y = Math.min(m.y.roundToInt() - dp(10), dm.heightPixels - dp(340))
                  if (lp.x < 0) lp.x = dp(4)
                  if (lp.y < 0) lp.y = dp(4)
                  try {
                      wm.addView(box, lp)
                      menuWin = box
                  } catch (e: Exception) {
                      toast("添加菜单失败：" + e.message)
                  }
              }

              private fun closeMarkerMenu() {
                  menuWin?.let {
                      try {
                          wm.removeView(it)
                      } catch (e: Exception) {
                      }
                  }
                  menuWin = null
              }

              private fun labelOf(m: Mapping): String {
                  val names = StringBuilder()
                  for (k in m.keys) names.append(Mapping.keyName(k))
                  val n = names.toString()
                  return when (m.type) {
                      Mapping.TYPE_TAP -> n
                      Mapping.TYPE_HOLD -> "按" + n
                      Mapping.TYPE_RAPID -> "连" + n
                      Mapping.TYPE_JOY -> "杆" + n
                      Mapping.TYPE_PAN -> "划" + n
                      else -> n
                  }
              }

              private fun colorOf(m: Mapping): Int {
                  return when (m.type) {
                      Mapping.TYPE_HOLD -> 0xE63747D0.toInt()
                      Mapping.TYPE_RAPID -> 0xE6EF6C00.toInt()
                      Mapping.TYPE_JOY -> 0xE62E7D32.toInt()
                      Mapping.TYPE_PAN -> 0xE66A1B9A.toInt()
                      else -> 0xE64A4A4A.toInt()
                  }
              }

              private fun typeName(t: String): String {
                  return when (t) {
                      Mapping.TYPE_HOLD -> "长按"
                      Mapping.TYPE_RAPID -> "连发"
                      Mapping.TYPE_JOY -> "摇杆"
                      Mapping.TYPE_PAN -> "划动"
                      else -> "点按"
                  }
              }

              // ---------- 悬浮界面 ----------

              private fun addBubble() {
                  if (bubble != null) return
                  val size = dp(46)
                  val b = TextView(this)
                  b.text = "\u2328"
                  b.textSize = 18f
                  b.gravity = Gravity.CENTER
                  b.setTextColor(Color.WHITE)
                  b.background = roundBg(0xE61E88E5.toInt(), dp(23))
                  val lp = overlayLp(size, size, true)
                  lp.x = dp(4)
                  lp.y = dp(220)

                  var startX = 0
                  var startY = 0
                  var baseX = 0
                  var baseY = 0
                  var moved = false

                  b.setOnTouchListener { v, e ->
                      when (e.actionMasked) {
                          MotionEvent.ACTION_DOWN -> {
                              startX = e.rawX.roundToInt()
                              startY = e.rawY.roundToInt()
                              baseX = lp.x
                              baseY = lp.y
                              moved = false
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = e.rawX.roundToInt() - startX
                              val dy = e.rawY.roundToInt() - startY
                              if (Math.abs(dx) > dp(6) || Math.abs(dy) > dp(6)) moved = true
                              lp.x = baseX + dx
                              lp.y = baseY + dy
                              wm.updateViewLayout(v, lp)
                              true
                          }
                          MotionEvent.ACTION_UP -> {
                              if (!moved) togglePanel()
                              true
                          }
                          else -> false
                      }
                  }
                  try {
                      wm.addView(b, lp)
                      bubble = b
                  } catch (e: Exception) {
                      toast("悬浮球的添加失败：" + e.message)
                  }
              }

              private fun togglePanel() {
                  if (panelShown) {
                      closePanel()
                      return
                  }
                  val p = buildPanel()
                  val lp = overlayLp(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      true
                  )
                  lp.gravity = Gravity.END or Gravity.CENTER_VERTICAL
                  lp.x = dp(8)
                  try {
                      wm.addView(p, lp)
                      panel = p
                      panelShown = true
                  } catch (e: Exception) {
                      toast("面板的添加失败：" + e.message)
                  }
              }

              private fun closePanel() {
                  val p = panel ?: return
                  try {
                      wm.removeView(p)
                  } catch (e: Exception) {
                  }
                  panel = null
                  panelShown = false
              }

              private fun buildPanel(): LinearLayout {
                  val box = LinearLayout(this)
                  box.orientation = LinearLayout.VERTICAL
                  box.setPadding(dp(6), dp(8), dp(6), dp(8))
                  box.background = roundBg(0xF0222222.toInt(), dp(14))

                  val label = TextView(this)
                  label.textSize = 9f
                  label.setTextColor(0xFF9E9E9E.toInt())
                  label.maxLines = 1
                  label.text = shortPkg(currentPkg)
                  pkgLabel = label
                  box.addView(label)

                  box.addView(pbtn("点") { placeSimple(Mapping.TYPE_TAP) })
                  box.addView(pbtn("按") { placeSimple(Mapping.TYPE_HOLD) })
                  box.addView(pbtn("连") { placeSimple(Mapping.TYPE_RAPID) })
                  box.addView(pbtn("杆") { placeJoy() })
                  box.addView(pbtn("划") { placePan() })

                  val eb = pbtn(if (editMode) "编" else "玩") { toggleEdit() }
                  editBtn = eb
                  box.addView(eb)

                  box.addView(pbtn("清") { clearCurrent() })
                  box.addView(pbtn("✕") { closePanel() })
                  return box
              }

              private fun toggleEdit() {
                  editMode = !editMode
                  stopAllLoops()
                  rebuildMarkers()
                  editBtn?.text = if (editMode) "编" else "玩"
                  toast(if (editMode) "编辑模式：长按标记可改键/删除" else "游玩模式：标记已隐藏")
              }

              private fun pbtn(text: String, onClick: () -> Unit): TextView {
                  val v = TextView(this)
                  v.text = text
                  v.textSize = 13f
                  v.gravity = Gravity.CENTER
                  v.setTextColor(Color.WHITE)
                  v.setPadding(dp(10), dp(7), dp(10), dp(7))
                  v.background = roundBg(0xFF37474F.toInt(), dp(9))
                  val lp = LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  )
                  lp.topMargin = dp(5)
                  v.layoutParams = lp
                  v.setOnClickListener { onClick() }
                  return v
              }

              private fun showPrompt(t: String) {
                  var tv = promptView
                  if (tv == null) {
                      tv = TextView(this)
                      tv.textSize = 12f
                      tv.setTextColor(Color.WHITE)
                      tv.setPadding(dp(12), dp(8), dp(12), dp(8))
                      tv.background = roundBg(0xE6000000.toInt(), dp(10))
                      val lp = overlayLp(
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          false
                      )
                      lp.gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL
                      lp.y = dp(140)
                      try {
                          wm.addView(tv, lp)
                          promptView = tv
                      } catch (e: Exception) {
                          return
                      }
                  }
                  tv.text = t
                  tv.visibility = View.VISIBLE
              }

              private fun hidePrompt() {
                  promptView?.visibility = View.GONE
              }

              private fun overlayLp(w: Int, h: Int, touchable: Boolean): WindowManager.LayoutParams {
                  var flags = WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS
                  if (!touchable) flags = flags or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                  val lp = WindowManager.LayoutParams(
                      w,
                      h,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      flags,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.START
                  return lp
              }

              private fun roundBg(color: Int, radius: Int): GradientDrawable {
                  val g = GradientDrawable()
                  g.shape = GradientDrawable.RECTANGLE
                  g.cornerRadius = radius.toFloat()
                  g.setColor(color)
                  return g
              }

              private fun dp(v: Int): Int = TypedValue.applyDimension(
                  TypedValue.COMPLEX_UNIT_DIP,
                  v.toFloat(),
                  resources.displayMetrics
              ).roundToInt()

              private fun toast(s: String) {
                  try {
                      Toast.makeText(this, s, Toast.LENGTH_SHORT).show()
                  } catch (e: Exception) {
                  }
              }
          }

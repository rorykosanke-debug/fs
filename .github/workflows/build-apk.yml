          import android.widget.TextView
          import android.widget.Toast
          import kotlin.math.roundToInt

          class MainActivity : Activity() {

              private lateinit var statusTv: TextView
              private lateinit var listBox: LinearLayout

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setBackgroundColor(Color.parseColor("#F7F8FA"))
                  root.setPadding(dp(20), dp(30), dp(20), dp(16))

                  root.addView(title("键盘映射 · 手游键鼠"))
                  root.addView(note("把外接键盘的按键映射为屏幕触摸：点按 / 长按 / 连发 / 摇杆 / 划动。"))

                  statusTv = note("")
                  statusTv.setPadding(0, dp(16), 0, dp(6))
                  statusTv.setTextColor(Color.parseColor("#333333"))
                  root.addView(statusTv)

                  root.addView(button("① 去开启无障碍服务") {
                      try {
                          startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      } catch (e: Exception) {
                          toast("请手动进入 设置 → 无障碍 开启本服务")
                      }
                  })
                  root.addView(button("② 刷新状态") { refresh() })
                  root.addView(button("③ 清空全部配置") {
                      Store.clearAll(this)
                      refresh()
                      toast("已清空")
                  })

                  root.addView(note(TIPS).apply { setPadding(0, dp(14), 0, dp(8)) })

                  val scroll = ScrollView(this)
                  listBox = LinearLayout(this)
                  listBox.orientation = LinearLayout.VERTICAL
                  scroll.addView(listBox)
                  root.addView(
                      scroll,
                      LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f)
                  )

                  setContentView(root)
                  refresh()
              }

              override fun onResume() {
                  super.onResume()
                  refresh()
              }

              private fun refresh() {
                  val on = isServiceEnabled()
                  if (on) {
                      statusTv.text = "✅ 无障碍服务：已开启\n⌨ 小圆点应已出现在屏幕上"
                      statusTv.setTextColor(Color.parseColor("#2E7D32"))
                  } else {
                      statusTv.text = "❌ 无障碍服务：未开启（必须开启才能用）"
                      statusTv.setTextColor(Color.parseColor("#C62828"))
                  }

                  listBox.removeAllViews()
                  val pkgs = Store.packages(this)
                  if (pkgs.isEmpty()) {
                      listBox.addView(note("还没有任何按键配置。\n开启服务后进入游戏，点屏幕上的 ⌨ → 点「点/按/连/杆/划」→ 点位置 → 按键盘键即可。"))
                      return
                  }
                  for (p in pkgs) {
                      val n = Store.load(this, p).size
                      val row = LinearLayout(this)
                      row.orientation = LinearLayout.HORIZONTAL
                      row.gravity = Gravity.CENTER_VERTICAL
                      row.setPadding(dp(12), dp(10), dp(12), dp(10))
                      row.background = GradientDrawable().apply {
                          cornerRadius = dp(12).toFloat()
                          setColor(Color.WHITE)
                      }
                      val text = note(p + "\n" + n + " 个按键")
                      text.setTextColor(Color.parseColor("#333333"))
                      row.addView(
                          text,
                          LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                      )
                      val del = button("删除")
                      del.layoutParams = LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                      del.setOnClickListener {
                          Store.delete(this, p)
                          refresh()
                      }
                      row.addView(del)
                      val lp = LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                      lp.bottomMargin = dp(8)
                      listBox.addView(row, lp)
                  }
              }

              private fun isServiceEnabled(): Boolean {
                  val cn = ComponentName(this, KeyMapService::class.java)
                  return try {
                      val s = Settings.Secure.getString(
                          contentResolver,
                          Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
                      ) ?: return false
                      s.split(':').any { it.trim().equals(cn.flattenToString(), true) }
                  } catch (e: Exception) {
                      false
                  }
              }

              private fun dp(v: Int): Int = TypedValue.applyDimension(
                  TypedValue.COMPLEX_UNIT_DIP,
                  v.toFloat(),
                  resources.displayMetrics
              ).roundToInt()

              private fun title(t: String): TextView {
                  val v = TextView(this)
                  v.text = t
                  v.textSize = 22f
                  v.setTextColor(Color.parseColor("#111111"))
